    <title>我们的地图</title>
    <script>
      // Phones that installed the old map shell keep a flickering blank page
      // until that service worker is gone. Clear it once, then reload.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return
          Promise.all(regs.map(function (reg) { return reg.unregister() })).then(function () {
            if (!window.caches) return
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key) }))
            })
          }).then(function () {
            if (sessionStorage.getItem('sw-cleared')) return
            sessionStorage.setItem('sw-cleared', '1')
            location.reload()
          })
        })
      }
    </script>
